<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel - CHASE LEVEL</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>
  <div class="container">
    <h1 id="boasVindas">Bem-vindo!</h1>
    <div class="perfil">
      <img id="personagemImg" src="" alt="Personagem">
      <div class="ficha">
        <label>BIRTH: <input id="birth" type="text"></label>
        <label>CHAR: <input id="char" type="text"></label>
        <label>NOME: <input id="nome" type="text"></label>
        <label>CLASSE: <input id="classe" type="text"></label>
        <label>DESPERTAR: <input id="despertar" type="text"></label>
        <label>POWER: <input id="power" type="text"></label>
        <label>LEVEL: <input id="level" type="text"></label>
        <label>TOWER: <input id="tower" type="text"></label>
        <label>BERKAS: <input id="berkas" type="text"></label>
        <label>VAZIO: <input id="vazio" type="text"></label>
        <label>VISUAL CHASE: <input id="visual" type="text"></label>
        <label>ATK. TOTAL: <input id="atk" type="text"></label>
      </div>
      <button onclick="salvarFicha()">Salvar</button>
    </div>
    <h2>Amigos</h2>
    <ul id="amigosLista"></ul>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
