<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa | Alcateia Voleibol</title>
  <link rel="stylesheet" href="css/maps.css" />
  <script src="../js/location-handler.js"></script>
</head>
<body>

  <!-- Banner topo -->
  <header class="banner-topo">
    <img src="imagens/banner.png" alt="Banner Alcateia" class="imagem-banner" />
  </header>

  <!-- Botões flutuantes -->
  <a href="https://www.alcateiavoleibol.com.br" class="botao-voltar">
    <img src="imagens/alcateia.png" alt="Logo Alcateia" class="icone-lobo" />
    Alcateia Voleibol
  </a>

  <button class="toggle-theme" aria-label="Alternar tema">🌓</button>

  <!-- Mapa -->
  <main>
    <div class="map-wrapper fade-in">
      <iframe 
        src="https://www.google.com/maps/d/embed?mid=1ZblUu70GKhVinuoZx_uU8qDnoHA32Uc&ehbc=2E312F" 
        allowfullscreen 
        loading="lazy">
      </iframe>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="rodape-site">
    <p>© 2025 Alcateia Voleibol. Todos os direitos reservados.</p>
  </footer>

  <script src="js/maps.js"></script>
</body>
</html>
