<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Jogos | Alcateia Vôlei</title>
    <link rel="stylesheet" href="agenda.css">
</head>
<body>
    <header>
        <h1>Próximos Jogos</h1>
        <button id="adminBtn">Área Administrativa</button>
    </header>
    <nav>
  <a href="../index.html">INÍCIO</a>
  <a href="../galeria/galeria.html">GALERIA</a>
  <a href="../sobre.html">SOBRE</a>
  <a href="../contato.html">CONTATO</a>
</nav>

    <main id="agenda"></main>

    <div id="adminPanel" class="hidden">
        <h2>Administração</h2>
        <input type="password" id="adminPassword" placeholder="Digite a senha...">
        <button onclick="authAdmin()">Entrar</button>

        <div id="adminControls" class="hidden">
            <h3>Adicionar Novo Jogo</h3>
            <input type="text" id="dataInput" placeholder="Data (YYYY-MM-DD)">
            <input type="text" id="horaInicioInput" placeholder="Hora Início (HH:MM)">
            <input type="text" id="horaFimInput" placeholder="Hora Fim (HH:MM)">
            <input type="text" id="localInput" placeholder="Local">
            <input type="text" id="enderecoInput" placeholder="Endereço">
            <button onclick="addJogo()">Adicionar Jogo</button>
        </div>
    </div>

    <script src="agenda.js"></script>
</body>
</html>
