<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎅 Feliz Natal! | Alcateia Voleibol</title>
    
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="shortcut icon" href="/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Imaginista">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <meta name="theme-color" content="#ffffff">
	
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=OpenSans:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #050d1a;
            --accent-color: #f5a623;
            --christmas-red: #c0392b;
            --glitch-color-1: #00ffea;
            --glitch-color-2: #ff0055;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            user-select: none;
        }

        /* Efeito de Glitch no Texto */
        .glitch-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            position: relative;
            animation: glitch-skew 0.5s infinite linear alternate-reverse;
        }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .glitch-text::before {
            left: 2px; text-shadow: -2px 0 var(--glitch-color-1);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px; text-shadow: -2px 0 var(--glitch-color-2);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(31px, 9999px, 94px, 0); transform: skew(0.85deg); }
            50% { clip: rect(70px, 9999px, 18px, 0); transform: skew(-0.85deg); }
            100% { clip: rect(85px, 9999px, 40px, 0); transform: skew(0.85deg); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 10px, 0); transform: skew(-0.85deg); }
            50% { clip: rect(20px, 9999px, 50px, 0); transform: skew(0.85deg); }
            100% { clip: rect(5px, 9999px, 80px, 0); transform: skew(-0.85deg); }
        }
        @keyframes glitch-skew {
            0% { transform: skew(-2deg); } 10% { transform: skew(2deg); }
            20% { transform: skew(-1deg); } 30% { transform: skew(3deg); }
            40% { transform: skew(-2deg); } 50% { transform: skew(1deg); }
            100% { transform: skew(0deg); }
        }

        .intro-logo {
            /* ALTERADO: Aumentei de 180px para 350px */
            width: 450px; 
            max-width: 90%; /* Garante que não estoure a tela no celular */
            filter: drop-shadow(0 0 20px rgba(245, 166, 35, 0.4)) hue-rotate(0deg);
            animation: logo-glitch 0.3s infinite;
            margin-bottom: 30px;
        }
        
        @keyframes logo-glitch {
            0% { filter: drop-shadow(0 0 20px rgba(245, 166, 35, 0.4)) hue-rotate(0deg); transform: translate(0); }
            25% { filter: drop-shadow(0 0 20px red) hue-rotate(90deg); transform: translate(-5px, 2px); opacity: 0.8; }
            50% { filter: drop-shadow(0 0 20px blue) hue-rotate(180deg); transform: translate(5px, -2px); }
            75% { filter: drop-shadow(0 0 20px green) hue-rotate(270deg); transform: translate(-2px, 5px); opacity: 0.6;}
            100% { filter: drop-shadow(0 0 20px rgba(245, 166, 35, 0.4)) hue-rotate(360deg); transform: translate(0); }
        }

        h1 { font-size: 1.8rem; margin-bottom: 10px; color: var(--christmas-red); }
        h2 { font-size: 1rem; color: var(--accent-color); margin-bottom: 40px; letter-spacing: 2px; }

        /* Cronômetro Maluco */
        #crazy-countdown {
            display: flex; gap: 8px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center;
        }
        .time-box {
            display: flex; flex-direction: column; align-items: center;
            background: rgba(255, 0, 0, 0.1);
            padding: 8px; border-radius: 10px;
            border: 2px solid red;
            min-width: 60px;
            animation: box-shake 0.2s infinite;
        }
        .time-val {
            font-size: 1.8rem; font-weight: 900;
            color: red;
            text-shadow: 0 0 10px red;
            font-family: 'Courier New', monospace;
        }
        .time-label { font-size: 0.6rem; text-transform: uppercase; opacity: 0.7; }

        @keyframes box-shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-2px, -2px) rotate(-1deg); background: rgba(255,0,0,0.2); }
            50% { transform: translate(-3px, 0px) rotate(1deg); }
            75% { transform: translate(3px, 2px) rotate(0deg); background: rgba(0,255,255,0.1); }
            100% { transform: translate(1px, -1px) rotate(1deg); }
        }

        .fake-btn {
            background: transparent; border: 2px solid red; color: red;
            padding: 15px 30px; font-size: 1rem; border-radius: 50px;
            font-weight: 900; cursor: not-allowed; text-transform: uppercase;
            letter-spacing: 1px; opacity: 0.8;
            box-shadow: 0 0 15px red;
            animation: pulse-btn 0.5s infinite;
            transition: all 0.3s;
        }
        .fake-btn:hover { background: rgba(255,0,0,0.2); transform: scale(1.05); }
        @keyframes pulse-btn { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #error-console {
            margin-top: 40px;
            font-family: 'Courier New', monospace;
            color: #00ffea;
            font-size: 0.8rem;
            height: 120px;
            overflow: hidden;
            text-align: left;
            width: 95%;
            max-width: 500px;
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border-left: 4px solid red;
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
        }
        .error-line { margin-bottom: 5px; text-transform: uppercase; }
        .blink { animation: blinker 0.2s linear infinite; color: red; font-weight: bold;}
        @keyframes blinker { 50% { opacity: 0; } }

        /* Media Queries para Celulares */
        @media (max-width: 480px) {
            h1 { font-size: 1.4rem; }
            h2 { font-size: 0.8rem; }
            .time-val { font-size: 1.4rem; }
            .time-box { min-width: 50px; }
            
            /* Ajuste extra para o logo não ocupar 100% em telas muito pequenas se não quiser */
            .intro-logo { width: 280px; } 
        }

    </style>
</head>
<body>

    <img src="imagens/logo-lobo.png" class="intro-logo" alt="Lobo Bugado - Alcateia Voleibol">

    <h1 class="glitch-text" data-text="⚠️ SYSTEM FAILURE ⚠️">⚠️ SYSTEM FAILURE ⚠️</h1>
    <h2 class="glitch-text" data-text="ALCATEIA_NATAL_ERROR_404">ALCATEIA_NATAL_ERROR_404</h2>

    <div id="crazy-countdown">
        <div class="time-box"><span class="time-val" id="d">??</span><span class="time-label">Dias</span></div>
        <div class="time-box"><span class="time-val" id="h">ERROR</span><span class="time-label">Horas</span></div>
        <div class="time-box"><span class="time-val" id="m">%$</span><span class="time-label">Min</span></div>
        <div class="time-box"><span class="time-val" id="s">🎅</span><span class="time-label">Seg</span></div>
    </div>

    <button class="fake-btn" onclick="fakeErrorAlert()">REINICIAR SISTEMA</button>

    <div id="error-console">
        <div class="error-line">> INICIANDO v2025...</div>
        <div class="error-line">> <span class="blink">ERRO CRÍTICO:</span> RENA NA PISTA.</div>
    </div>

    <script>
        // --- FUNÇÃO DO CRONÔMETRO MALUCO ---
        const dEl = document.getElementById('d');
        const hEl = document.getElementById('h');
        const mEl = document.getElementById('m');
        const sEl = document.getElementById('s');

        const randomStuff = ['??', '##', 'BUG', '404', '🎅', '🎄', '🏐', '🐺', '-666', 'NULL', 'NaN', 'HELP'];

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function crazyTimer() {
            dEl.innerText = getRandomInt(-99, 99);
            
            if(Math.random() > 0.5) {
                hEl.innerText = randomStuff[getRandomInt(0, randomStuff.length - 1)];
            } else {
                hEl.innerText = getRandomInt(100, 999);
            }
            
            if(Math.random() > 0.6) {
                mEl.innerText = randomStuff[getRandomInt(0, randomStuff.length - 1)];
            } else {
                mEl.innerText = "ERRO";
            }

            sEl.innerText = randomStuff[getRandomInt(0, randomStuff.length - 1)];
        }

        setInterval(crazyTimer, 80); // Velocidade do bug

        // --- FUNÇÃO DO CONSOLE DE ERRO FAKE ---
        const consoleEl = document.getElementById('error-console');
        const fakeErrors = [
            "> ACESSANDO /v2025... [NEGADO]",
            "> <span class='blink'>ALERTA:</span> RENA COMEU O CABO.",
            "> ERRO 500: ESTAGIÁRIO CAIU NO SERVIDOR.",
            "> AVISO: PAPAI NOEL ESTÁ MUITO BRAVO.",
            "> CARREGANDO DADOS... [CORROMPIDO]",
            "> SISTEMA INVADIDO POR: GRINCH_123",
            "> <span class='blink'>CRITICAL:</span> FALTA DE VOLEIBOL.",
            "> TENTANDO REINICIAR... [FALHA]",
            "> LIBERANDO VÍRUS NATALINO... 🎄🦠"
        ];

        function addFakeError() {
            const newLine = document.createElement('div');
            newLine.className = 'error-line';
            newLine.innerHTML = fakeErrors[getRandomInt(0, fakeErrors.length - 1)];
            consoleEl.appendChild(newLine);
            consoleEl.scrollTop = consoleEl.scrollHeight; 

            if(consoleEl.children.length > 7) {
                consoleEl.removeChild(consoleEl.firstChild);
            }
        }
        setInterval(addFakeError, 800);

        // --- FUNÇÃO DO BOTÃO FAKE ---
        function fakeErrorAlert() {
            alert("❌ ERRO NO UPDATE v2025 ❌\n\nO sistema travou por excesso de espírito natalino.\n\nTentando reiniciar... Aguarde o Papai Noel liberar o acesso.");
        }

    </script>
</body>
</html>
