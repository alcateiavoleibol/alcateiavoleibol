<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ValhallaBR - Boas Vindas</title>
  <link rel="icon" href="imagens/favicon/favicon.png" />
  <style>
    :root {
      --background-style: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: var(--background-style), url('imagens/fundo.jpg') no-repeat center center/cover;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    #intro-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(5,30,50,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 1s ease forwards;
    }

    #typed-title {
      font-size: 4.8em;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid #fff;
      margin-bottom: 30px;
      max-width: fit-content;
    }

    #typed-title::after {
      content: "|";
      animation: blinkCursor 0.8s infinite;
      margin-left: 5px;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #start-btn {
      padding: 15px 30px;
      font-size: 3.2em;
      background: linear-gradient(90deg, #1e3c72, #2a5298);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s ease;
      opacity: 0;
      display: none;
    }

    #start-btn.show {
      display: inline-block;
      opacity: 1;
    }

    #start-btn:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0 }
      to { opacity: 1 }
    }

    @keyframes fadeInZoom {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    .welcome-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeInContent 1s ease forwards;
      max-width: 800px;
      margin: auto;
      text-align: center;
    }

    @keyframes fadeInContent {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #banner img {
      max-width: 90vw;
      height: auto;
      border-radius: 40px;
      box-shadow: 0 0 20px #00bfff88;
      margin-bottom: 20px;
      animation: fadeInZoom 1.2s ease forwards;
    }

    .btn-entrar {
      margin: 20px 10px;
      padding: 12px 25px;
      background: linear-gradient(90deg, #1e3c72, #2a5298);
      color: white;
      font-size: 1.2em;
      font-weight: bold;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transition: transform 0.2s ease;
    }

    .btn-entrar:hover {
      transform: scale(1.05);
    }

    .botoes-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .audio-controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
    }

    canvas#particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    footer {
      margin-top: 30px;
      padding: 25px;
      text-align: center;
      background: rgba(31, 31, 31, 0.8);
      color: #b52643;
      font-size: clamp(18px, 1.5vw, 14px);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.9);
      border-top: 1px solid #444;
      border-radius: 8px 8px 0 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div id="intro-screen">
    <h1 id="typed-title"></h1>
    <button id="start-btn">🎮 Iniciar Experiência</button>
  </div>

  <audio id="type-sound" src="mp3/typewriter.mp3" preload="auto"></audio>

  <div class="welcome-container" id="main-content">
    <div id="banner">
      <img src="imagens/banner.png" alt="Banner ValhallaBR" />
    </div>

    <div class="botoes-container">
      <a href="perfil/index.html" class="btn-entrar" id="btn-perfil">👤 PERFIL</a>
	  <a href="titulos/index.html" class="btn-entrar">🏆 TÍTULOS</a>
      <a href="#" class="btn-entrar">❌ INVENTÁRIO 🚧</a>
    </div>

    <audio id="bg-music" src="mp3/hope-ptbr.mp3" preload="auto" loop></audio>

    <div class="audio-controls">
      <button id="play-pause">▶ Play</button>
      <button id="volume-up">🔊 +</button>
      <button id="volume-down">🔉 -</button>
    </div>

    <footer>© 2025 VALHALLA. Todos os direitos reservados.</footer>
  </div>

  <script>
    // Partículas
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particlesArray = [];
    class Particle {
      constructor(){
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = (Math.random() - 0.5) * 1;
        this.speedY = (Math.random() - 0.5) * 1;
      }
      update(){
        this.x += this.speedX;
        this.y += this.speedY;
        if(this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if(this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw(){
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    function initParticles(){
      particlesArray = [];
      for(let i = 0; i < 80; i++){
        particlesArray.push(new Particle());
      }
    }
    function animateParticles(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particlesArray.forEach(p=>{
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    initParticles();
    animateParticles();
    window.addEventListener('resize', ()=>{
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    });

    // Digitação com som
    const text = "Bem-vindo à ValhallaBR!";
    const titleEl = document.getElementById("typed-title");
    const typeSound = document.getElementById("type-sound");
    const startBtn = document.getElementById("start-btn");

    let i = 0;
function typeLetter() {
  if (i < text.length) {
    titleEl.textContent += text.charAt(i);
    typeSound.currentTime = 0;
    typeSound.play();
    i++;
    setTimeout(typeLetter, 100); // velocidade da digitação
  } else {
    startBtn.classList.add("show");
  }
}
window.addEventListener("DOMContentLoaded", typeLetter);

// Áudio ambiente
const audio = document.getElementById('bg-music');
const playPauseBtn = document.getElementById('play-pause');
const volumeUpBtn = document.getElementById('volume-up');
const volumeDownBtn = document.getElementById('volume-down');
let isPlaying = false;

// Botão de entrada
startBtn.addEventListener('click', () => {
  document.getElementById('intro-screen').style.display = 'none';
  document.getElementById('main-content').style.display = 'flex';

  audio.volume = 0.3;
  audio.muted = false;
  audio.play().then(() => {
    isPlaying = true;
    playPauseBtn.textContent = '⏸ Pause';
  }).catch(err => {
    console.log('Autoplay bloqueado:', err);
    playPauseBtn.textContent = '▶ Play';
  });
});

// Botão play/pause
playPauseBtn.addEventListener('click', () => {
  if (isPlaying) {
    audio.pause();
    playPauseBtn.textContent = '▶ Play';
  } else {
    audio.play().catch(err => console.log('Erro ao tocar:', err));
    playPauseBtn.textContent = '⏸ Pause';
  }
  isPlaying = !isPlaying;
});

// Volume +
volumeUpBtn.addEventListener('click', () => {
  audio.volume = Math.min(audio.volume + 0.1, 1);
});

// Volume -
volumeDownBtn.addEventListener('click', () => {
  audio.volume = Math.max(audio.volume - 0.1, 0);
});

// Salvar tempo da música ao entrar no perfil
document.getElementById('btn-perfil').addEventListener('click', () => {
  sessionStorage.setItem('audioTime', audio.currentTime);
});
  </script>
</body>
</html>
