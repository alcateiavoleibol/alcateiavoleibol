<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ValhallaBR</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header>
    <img src="imagens/banner.png" alt="Banner ValhallaBR" class="banner">
  </header>

  <main>
    <h1 class="titulo">VALHALLABR</h1>
    <div class="botoes">
  <button onclick="salvarDados()">Salvar no Navegador</button>
  <button onclick="baixarJSON()">Salvar como Arquivo</button>
  <input type="file" id="importarJSON" accept=".json" onchange="carregarArquivo(event)" />
</div>
    <table>
      <thead>
        <tr>
          <th>Birth</th>
          <th>CHAR</th>
          <th>Nome</th>
          <th>Classe</th>
          <th>Despertar</th>
          <th>Power</th>
          <th>Level</th>
          <th>Tower</th>
          <th>Berkas</th>
          <th>Vazio</th>
          <th>SR</th>
          <th>Visual Chase</th>
          <th>Atk. Total</th>
        </tr>
      </thead>
      <tbody id="tabela-corpo">
        <!-- Linhas da tabela são geradas dinamicamente em JavaScript -->
      </tbody>
    </table>
  </main>

  <footer>
    <p>2025 desenvolvido por Rb</p>
  </footer>

  <script src="js/dados.js"></script>
</body>

</html>
