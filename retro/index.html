<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcateia OS</title>

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="shortcut icon" href="/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Imaginista">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <meta name="theme-color" content="#ffffff">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #008080; /* Teal do Windows 95 */
            font-family: 'Arial', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            user-select: none;
        }

        /* --- ESTILO DAS JANELAS (Bordas 3D) --- */
        .win95-window {
            background-color: #c0c0c0;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            box-shadow: 2px 2px 0px #808080;
            
            /* Largura aumentada para caber o logo de 450px */
            width: 550px; 
            max-width: 90%; /* Isso garante a responsividade no mobile */
            
            padding: 3px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 4px 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .btn-close {
            background: #c0c0c0;
            border-top: 1px solid #fff;
            border-left: 1px solid #fff;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            width: 20px;
            height: 20px;
            text-align: center;
            line-height: 16px;
            font-weight: bold;
            color: black;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-close:active {
            border-top: 1px solid #000;
            border-left: 1px solid #000;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
            transform: translate(1px, 1px);
        }

        .window-content {
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .retro-logo {
            width: 450px; /* Tamanho grande igual os outros */
            max-width: 100%; /* FUNDAMENTAL para não quebrar no celular */
            height: auto;
            
            /* Efeito pixelado para combinar */
            image-rendering: pixelated; 
            margin-bottom: 20px;
            
            /* Moldura afundada em volta da imagem */
            border: 2px solid #808080;
            border-right-color: #fff;
            border-bottom-color: #fff;
            background: #fff; /* Fundo branco pra imagem destacar */
            padding: 10px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem; /* Um pouco menor pq a fonte é larga */
            color: #000;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .win-btn {
            background: #c0c0c0;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            padding: 8px 30px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            outline: none;
            box-shadow: 1px 1px 0px #000;
        }
        .win-btn:active {
            border-top: 2px solid #000;
            border-left: 2px solid #000;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* --- BARRA DE TAREFAS --- */
        .taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: #c0c0c0;
            border-top: 2px solid #fff;
            display: flex;
            align-items: center;
            padding: 2px;
            z-index: 100;
        }

        .start-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 2px 10px;
            height: 30px;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            font-weight: bold;
            font-style: italic;
            margin-left: 2px;
            box-shadow: 1px 1px 0 #000;
            cursor: default;
        }
        
        .tray-clock {
            margin-left: auto;
            border: 2px solid #808080;
            border-right-color: #fff;
            border-bottom-color: #fff;
            padding: 2px 10px;
            margin-right: 5px;
            font-size: 12px;
            background: #c0c0c0;
        }

        /* Ícones da área de trabalho */
        .desktop-icons {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1;
        }
        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 70px;
            text-align: center;
            color: white;
            font-size: 12px;
            text-shadow: 1px 1px 0 #000;
            cursor: pointer;
        }
        .icon i {
            font-size: 32px;
            margin-bottom: 5px;
            color: #fff;
        }

        /* === AJUSTES MOBILE === */
        @media (max-width: 600px) {
            .win95-window { 
                width: 95%; /* Ocupa quase toda a largura no celular */
                max-width: 95%;
            }
            .retro-logo {
                width: 100%; /* Ajusta o logo para caber na janela do celular */
            }
            h1 { font-size: 0.8rem; } /* Fonte menor para não quebrar */
            
            /* Esconde os ícones do desktop no celular para limpar a tela */
            .desktop-icons { display: none; }
        }

    </style>
</head>
<body>

    <div class="desktop-icons">
        <div class="icon">
            <i class="fa-solid fa-computer"></i>
            <span>My Computer</span>
        </div>
        <div class="icon">
            <i class="fa-solid fa-trash-can"></i>
            <span>Recycle Bin</span>
        </div>
        <div class="icon">
            <i class="fa-solid fa-folder-open"></i>
            <span>Alcateia_Files</span>
        </div>
    </div>

    <div class="win95-window">
        <div class="title-bar">
            <span>C:\Alcateia\Retro\Construction.exe</span>
            <div class="btn-close" onclick="alert('Erro: Você não pode fechar o espírito esportivo!')">X</div>
        </div>
        
        <div class="window-content">
            <img src="../imagens/logo-lobo.png" class="retro-logo" alt="Logo Alcateia">
            
            <h1>WORK IN PROGRESS...</h1>
            
            <p>O sistema encontrou um bloqueio na rede.<br>
            Aguarde enquanto reiniciamos o servidor.</p>

            <button class="win-btn" onclick="location.reload()">OK</button>
        </div>
    </div>

    <div class="taskbar">
        <div class="start-btn">
            <i class="fa-brands fa-windows"></i> Start
        </div>
        <div class="tray-clock" id="clock">00:00 AM</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            
            document.getElementById('clock').innerText = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
