<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Alcateia Voleibol</title>

  <!-- CSS global -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsivo.css">

  <!-- CSS específico da página -->
  <link rel="stylesheet" href="css/contato.css">
</head>
<body>

  <!-- Banner -->
  <header class="top-banner">
    <img src="imagens/banner.png" alt="Banner" class="banner">
  </header>

  <!-- Menu -->
  <nav id="menu">
    <button id="menu-toggle">☰ Menu</button>
    <ul id="menu-list">
      <li><a href="index.html">Início</a></li>
      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="galeria.html">Galeria</a></li>
      <li><a href="agenda.html">Agenda</a></li>
      <li><a href="contato.html">Contato</a></li>
    </ul>
  </nav>

  <!-- Conteúdo -->
  <main>
    <div class="contato-container">
      <h1>Fale Conosco</h1>
      <p>Preencha o formulário abaixo para entrar em contato com a equipe Alcateia Voleibol.</p>

      <form>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

        <button type="submit">Enviar</button>
      </form>
    </div>
  </main>

  <!-- Rodapé -->
  <footer>
    <p>&copy; 2025 Alcateia Voleibol. Todos os direitos reservados.</p>
  </footer>

  <!-- JavaScript do menu -->
  <script src="js/script.js"></script>
</body>
</html>
