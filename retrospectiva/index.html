<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNAL | Alcateia Voleibol</title>

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="shortcut icon" href="/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Imaginista">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <meta name="theme-color" content="#ffffff">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --radar-green: #00ffaa;
            --radar-bg: #001a11;
            --grid-color: rgba(0, 255, 170, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--radar-bg);
            color: var(--radar-green);
            font-family: 'Orbitron', sans-serif;
            
            /* --- ALTERAÇÃO: TRAVAR ROLAGEM DA PÁGINA --- */
            height: 100vh; /* Altura fixa da tela */
            overflow: hidden; /* Remove barra de rolagem geral */
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            padding: 10px;
        }

        /* Efeito de varredura do radar no fundo */
        body::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 150vmax; height: 150vmax;
            background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(0, 255, 170, 0.1) 60deg, transparent 61deg);
            transform: translate(-50%, -50%);
            animation: radar-sweep 4s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            background: rgba(0, 26, 17, 0.9);
            padding: 30px;
            border: 2px solid var(--radar-green);
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.3);
            border-radius: 10px;
            width: 100%;
            max-width: 700px;
            position: relative;

            /* --- ALTERAÇÃO: SEGURANÇA PARA TELAS PEQUENAS --- */
            /* Se o conteúdo for maior que a tela, rola SÓ DENTRO do container */
            max-height: 98vh; 
            overflow-y: auto;
            /* Esconde a barra de rolagem do container para ficar bonito */
            scrollbar-width: none; 
        }
        .container::-webkit-scrollbar { display: none; }

        .target-reticle {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            border: 1px dashed var(--radar-green);
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
            z-index: -1;
        }

        .radar-logo {
            width: 450px;
            max-width: 100%;
            filter: grayscale(100%) sepia(100%) hue-rotate(120deg) saturate(300%) brightness(1.2) drop-shadow(0 0 10px var(--radar-green));
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        h1 span { color: #fff; animation: blink 1s infinite; }

        h2 {
            font-size: 1rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        /* --- SLIDER DE TUNING --- */
        .tuner-section {
            margin: 20px 0;
            padding: 15px;
            border-top: 1px solid var(--grid-color);
            border-bottom: 1px solid var(--grid-color);
        }
        
        .frequency-display {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 10px;
            background: rgba(0, 255, 170, 0.2);
            outline: none;
            border-radius: 5px;
            border: 1px solid var(--radar-green);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px; height: 20px;
            background: var(--radar-green);
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--radar-green);
        }

        /* --- GRID DE BOTÕES DE EMERGÊNCIA --- */
        .sector-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .sector-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: rgba(0, 255, 170, 0.05);
            color: var(--radar-green);
            border: 1px solid var(--radar-green);
            padding: 15px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .sector-btn i {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .sector-btn:hover {
            background: var(--radar-green);
            color: var(--radar-bg);
            box-shadow: 0 0 20px var(--radar-green);
            transform: translateY(-2px);
        }
        
        .sector-btn::after {
            content: 'OFFLINE';
            position: absolute;
            top: 2px; right: 2px;
            font-size: 0.5rem;
            opacity: 0.6;
        }

        @keyframes radar-sweep {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* === RESPONSIVIDADE MOBILE === */
        @media (max-width: 600px) {
            .container {
                padding: 20px; /* Reduzi padding para caber mais coisa */
            }

            h1 { font-size: 1.4rem; margin-bottom: 5px; }
            h2 { font-size: 0.8rem; margin-bottom: 10px; }
            
            /* Logo menor no celular para evitar rolagem */
            .radar-logo { width: 200px; margin-bottom: 10px; }
            
            .tuner-section { margin: 10px 0; padding: 10px; }

            .sector-grid {
                grid-template-columns: 1fr; 
                gap: 10px; /* Menos espaço entre botões */
            }
            
            .sector-btn {
                padding: 10px;
                flex-direction: row;
                justify-content: flex-start;
                gap: 15px;
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <div class="target-reticle"></div>

    <div class="container">
        <img src="/imagens/logo-lobo.png" class="radar-logo" alt="Alcateia Radar">

        <h1>SIGNAL <span>LOST</span> // 404</h1>
        <h2>Scanning for backup sectors...</h2>

        <div class="tuner-section">
            <div class="frequency-display" id="freq-val">SEARCHING...</div>
            <input type="range" min="100" max="999" value="500" id="tunerInput">
        </div>
        
        <p style="font-size: 0.8rem; opacity: 0.7;">AVAILABLE EMERGENCY JUMPS:</p>

        <div class="sector-grid">
            
            <a href="../v2025" class="sector-btn">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>SECTOR v2025<br><small>(System Crash)</small></span>
            </a>

            <a href="../season" class="sector-btn">
                <i class="fa-solid fa-tv"></i>
                <span>SECTOR SEASON<br><small>(No Signal)</small></span>
            </a>

            <a href="../temp" class="sector-btn">
                <i class="fa-solid fa-microchip"></i>
                <span>SECTOR TEMP<br><small>(Uploading)</small></span>
            </a>

            <a href="../retro" class="sector-btn">
                <i class="fa-brands fa-windows"></i>
                <span>SECTOR RETRO<br><small>(Legacy OS)</small></span>
            </a>

        </div>
    </div>

    <script>
        const tunerInput = document.getElementById('tunerInput');
        const freqVal = document.getElementById('freq-val');

        tunerInput.addEventListener('input', function() {
            const randomDecimal = Math.floor(Math.random() * 99);
            freqVal.innerText = `TUNING: ${this.value}.${randomDecimal} MHz`;
        });
    </script>

</body>
</html>
