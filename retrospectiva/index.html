<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Retrospectiva | Alcateia</title>

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="shortcut icon" href="/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Imaginista">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <meta name="theme-color" content="#ffffff">

    <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Courier+Prime:ital,wght@0,400;1,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --sepia-bg: #1a1510;
            --film-color: #e6dcc8;
            --dark-film: #0a0a0a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--sepia-bg);
            color: var(--film-color);
            font-family: 'Courier Prime', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Efeito de Vinheta (Cantos escuros) */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, black 100%);
            z-index: 5;
            pointer-events: none;
        }

        /* Efeito de Risco/Ruído de Filme Antigo */
        .film-grain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 4;
            pointer-events: none;
            animation: grain-dance 0.2s steps(4) infinite;
        }

        /* Container que parece um Rolo de Filme */
        .cinema-container {
            position: relative;
            z-index: 10;
            text-align: center;
            border-left: 20px dashed var(--dark-film); /* Furos do filme */
            border-right: 20px dashed var(--dark-film);
            padding: 40px;
            background: rgba(255, 245, 230, 0.05);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            width: 90%;
            max-width: 800px;
            
            /* Animação de Projetor Tremendo */
            animation: projector-shake 3s infinite;
        }

        /* Linha vertical que fica passando (risco no filme) */
        .scratch {
            position: absolute;
            top: 0; left: 20%;
            width: 2px; height: 100%;
            background: rgba(255,255,255,0.1);
            animation: scratch-move 0.4s infinite;
            z-index: 6;
            pointer-events: none;
        }

        .cinema-logo {
            width: 450px;
            max-width: 100%; /* Responsividade garantida */
            margin-bottom: 20px;
            
            /* Filtro Sépia e Alto Contraste para parecer foto antiga */
            filter: sepia(100%) contrast(1.2) brightness(0.8);
            opacity: 0.9;
        }

        h1 {
            font-family: 'Limelight', cursive; /* Fonte Art Deco */
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(230, 220, 200, 0.5);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 30px;
            font-style: italic;
            opacity: 0.8;
            border-top: 1px solid var(--film-color);
            border-bottom: 1px solid var(--film-color);
            display: inline-block;
            padding: 5px 20px;
        }

        .countdown-circle {
            width: 60px;
            height: 60px;
            border: 3px solid var(--film-color);
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-family: 'Limelight', cursive;
            position: relative;
        }
        
        /* O "ponteiro" do countdown de filme */
        .countdown-circle::before {
            content: "";
            position: absolute;
            top: 0; left: 50%;
            width: 1px; height: 50%;
            background: var(--film-color);
            transform-origin: bottom center;
            animation: radar-sweep 1s linear infinite;
        }

        /* Animações */
        @keyframes projector-shake {
            0% { transform: translateY(0); opacity: 1; }
            5% { transform: translateY(-1px); opacity: 0.95; }
            10% { transform: translateY(1px); opacity: 1; }
            15% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(0); opacity: 1; }
            55% { transform: translateY(1px); opacity: 0.9; }
            60% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(0); }
        }

        @keyframes grain-dance {
            0% { transform: translate(0,0); }
            100% { transform: translate(-10px, -10px); }
        }

        @keyframes scratch-move {
            0% { left: 10%; opacity: 0; }
            50% { opacity: 0.4; }
            100% { left: 90%; opacity: 0; }
        }

        @keyframes radar-sweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .cinema-container {
                border-left-width: 10px;
                border-right-width: 10px;
                padding: 20px;
                width: 95%;
            }
            h1 { font-size: 1.8rem; letter-spacing: 2px; }
            h2 { font-size: 0.9rem; }
            .cinema-logo { width: 300px; } /* Ajuste visual leve, mas max-width protege */
        }

    </style>
</head>
<body>

    <div class="film-grain"></div>
    <div class="scratch"></div>

    <div class="cinema-container">
        <img src="../imagens/logo-lobo.png" class="cinema-logo" alt="Logo Alcateia Cine">

        <h1>Retrospectiva</h1>
        <h2>Carregando Melhores Momentos...</h2>

        <div class="countdown-circle" id="counter">5</div>
    </div>

    <script>
        // Script simples para o contador 5, 4, 3... em loop
        const counterEl = document.getElementById('counter');
        let count = 5;

        setInterval(() => {
            count--;
            if (count < 1) count = 5;
            counterEl.innerText = count;
        }, 1000);
    </script>
</body>
</html>
