<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Placar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="css/placar.css">
  <link rel="stylesheet" href="css/responsivo-placar.css">
</head>
<body>
  <div class="placar-container">
    <div class="data-hora" id="dataHora"></div>
    <div class="cronometro" id="cronometro">00:00</div>

    <div class="times">
      <div class="time-bloco">
        <input class="time-nome-input" id="time1-nome" value="ALCATEIA A1">
        <div class="set-control">
          <button onclick="alterarSet('set1', -1)">-</button>
          <span id="set1">0</span>
          <button onclick="alterarSet('set1', 1)">+</button>
        </div>
      </div>

      <div class="set-info">SETS</div>

      <div class="time-bloco">
        <input class="time-nome-input" id="time2-nome" value="ALCATEIA A2">
        <div class="set-control">
          <button onclick="alterarSet('set2', -1)">-</button>
          <span id="set2">0</span>
          <button onclick="alterarSet('set2', 1)">+</button>
        </div>
      </div>
    </div>

    <div class="pontuacoes">
      <div class="pontuacao">
        <button onclick="alterarPonto('time1', -1)">-</button>
        <span id="pontos1">0</span>
        <button onclick="alterarPonto('time1', 1)">+</button>
      </div>

      <span class="versus">X</span>

      <div class="pontuacao">
        <button onclick="alterarPonto('time2', -1)">-</button>
        <span id="pontos2">0</span>
        <button onclick="alterarPonto('time2', 1)">+</button>
      </div>
    </div>

    <div class="botoes">
      <button onclick="iniciarPartida()">START</button>
      <button onclick="resetarPontos()">ZERAR PONTOS</button>
      <button onclick="alternarTelaCheia()">TELA CHEIA</button>
      <button onclick="girarTela()">GIRAR TELA</button>
      <button onclick="resetarPartida()">RESET GERAL</button>
    </div>

    <div class="creditos">Desenvolvido por Alcateia Voleibol</div>
  </div>

  <script src="js/placar.js"></script>
  <script>
    // Função de segurança (caso o JS externo não carregue)
    function alterarSet(setId, valor) {
      const elemento = document.getElementById(setId);
      let atual = parseInt(elemento.innerText);
      atual = Math.max(0, atual + valor);
      elemento.innerText = atual;
    }
  </script>
</body>
</html>
