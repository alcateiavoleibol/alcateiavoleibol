<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FARM</title>
    <link rel="icon" type="image/png" href="../imagens/favicon/favicon.png">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <style>
        /* --- CONFIGURAÇÕES GERAIS --- */
        :root {
            --primary: #bb86fc;
            --secondary: #03dac6; /* Ciano/Teal */
            --danger: #cf6679;
            --bg: #0b0b0b;
            --surface: rgba(30, 30, 30, 0.6);
            --surface-hover: rgba(50, 50, 50, 0.8);
            --border: 1px solid rgba(255, 255, 255, 0.1);
            --glass: rgba(15, 15, 15, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex; flex-direction: column;
        }

        /* --- BACKGROUND ANIMATION --- */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
        }

        /* --- HERO BANNER (PC) --- */
        .hero-banner {
            width: 100%; height: 350px;
            position: relative; overflow: hidden;
            background: #020202; 
            z-index: 1; display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid rgba(187, 134, 252, 0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .hero-banner img {
            width: 100%; height: 100%;
            object-fit: contain; object-position: center center;
            opacity: 1; display: block;
        }

        .hero-banner::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent 0%, rgba(255, 255, 255, 0.05) 20%, rgba(255, 255, 255, 0.2) 50%, rgba(255, 255, 255, 0.05) 80%, transparent 100%);
            transform: skewX(-25deg);
            animation: scanLight 6s ease-in-out infinite; pointer-events: none;
        }
        @keyframes scanLight { 0% { left: -100%; opacity: 0; } 20% { opacity: 1; } 50% { left: 200%; opacity: 0; } 100% { left: 200%; opacity: 0; } }

        /* --- HEADER & MENU --- */
        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--glass); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(187, 134, 252, 0.2);
            padding: 0.8rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 30px rgba(0,0,0,0.6);
        }

        .brand { display: flex; flex-direction: column; min-width: 180px; }

        .brand h1 {
            font-size: 1.8rem; letter-spacing: 2px; text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--primary)); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(187, 134, 252, 0.3); margin: 0;
        }
        .brand h3 { margin: 0; color: #aaa; font-size: 0.9rem; letter-spacing: 4px; text-transform: uppercase; margin-top: -5px; }
        .info-panel { font-size: 0.75rem; display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }
        .cache-info { color: #888; }
        .cache-info span { color: var(--primary); font-weight: bold; }
        .time-info { color: #aaa; font-size: 0.8rem; display: flex; align-items: center; gap: 5px;}
        .real-time { color: var(--secondary); font-weight: 800; font-variant-numeric: tabular-nums; text-shadow: 0 0 5px rgba(3, 218, 198, 0.4); }

        .main-nav { display: flex; gap: 15px; }
        .nav-link {
            text-decoration: none; color: #ccc; font-weight: 700; text-transform: uppercase; font-size: 1.4rem;
            padding: 8px 16px; border-radius: 4px; transition: 0.3s; display: flex; align-items: center; gap: 6px;
            border-bottom: 2px solid transparent;
        }
        .nav-link:hover, .nav-link.active {
            color: #fff; text-shadow: 0 0 10px var(--secondary); border-bottom: 2px solid var(--secondary);
            background: rgba(255, 255, 255, 0.05);
        }

        /* --- CONTROLES --- */
        .controls { display: flex; gap: 10px; align-items: center; min-width: 180px; justify-content: flex-end; }
        
        .btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--primary);
            color: var(--primary); padding: 8px 15px; cursor: pointer;
            border-radius: 4px; transition: 0.3s; font-size: 0.8rem; font-weight: bold; text-transform: uppercase;
        }
        .btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        
        .btn-load { position: relative; overflow: hidden; border-color: var(--secondary); color: var(--secondary); }
        .btn-load:hover { background: var(--secondary); color: #000; box-shadow: 0 0 15px var(--secondary); border-color: var(--secondary); }
        .btn-load input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .btn-print { border-color: #fff; color: #fff; }
        .btn-print:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }

        /* --- DASHBOARD --- */
        .dashboard { max-width: 1400px; margin: 30px auto; padding: 0 20px; display: flex; justify-content: center; width: 100%; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            align-items: stretch;
            width: 100%;
        }

        .dash-card {
            background: linear-gradient(135deg, rgba(44, 26, 61, 0.7) 0%, rgba(30, 30, 30, 0.7) 100%);
            border: 1px solid var(--primary); border-radius: 12px;
            padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(187, 134, 252, 0.1);
            position: relative; overflow: hidden; backdrop-filter: blur(10px);
            min-height: 140px;
        }
        .dash-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
        
        .dash-card h2 { color: var(--secondary); text-transform: uppercase; font-size: 1.1rem; margin-bottom: 5px; letter-spacing: 1px; text-align: center; }
        .dash-card .subtitle { font-size: 0.8rem; color: #aaa; margin-bottom: 15px; text-align: center; }

        /* Ferramentas do Dashboard */
        .tools-row { display: flex; width: 100%; gap: 10px; margin-top: 10px; }
        .tool-group { display: flex; flex-direction: column; width: 100%; }
        .tool-group label { font-size: 0.7rem; color: #888; margin-bottom: 3px; text-transform: uppercase; }
        
        select.dash-select {
            background: rgba(0,0,0,0.5); border: 1px solid #555; color: #fff;
            padding: 8px; border-radius: 6px; width: 100%; font-size: 0.9rem;
            cursor: pointer; transition: 0.3s;
        }
        select.dash-select:focus { border-color: var(--secondary); outline: none; background: #000; }

        /* Botões de Ação em Lote */
        .action-buttons { display: flex; gap: 5px; margin-top: 5px; }
        
        .btn-action {
            flex: 1; border: none; padding: 8px;
            font-weight: bold; cursor: pointer; border-radius: 6px; 
            text-transform: uppercase; font-size: 0.8rem; transition: 0.3s;
        }
        .btn-exec { background: var(--secondary); color: #000; }
        .btn-exec:hover { background: #fff; box-shadow: 0 0 10px var(--secondary); }
        
        .btn-reset { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-reset:hover { background: var(--danger); color: #fff; box-shadow: 0 0 10px var(--danger); }

        /* PIPS (Bolinhas) */
        .pips-container { display: flex; gap: 8px; }
        .pip {
            width: 20px; height: 20px; border: 2px solid #555; border-radius: 50%;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(0,0,0,0.3);
        }
        .pip:hover { border-color: #fff; transform: scale(1.2); }
        .pip.active {
            background: var(--secondary); border-color: var(--secondary);
            box-shadow: 0 0 10px var(--secondary);
        }

        /* Progresso */
        .progress-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 8px; }
        .progress-header { display: flex; justify-content: space-between; align-items: flex-end; }
        .pct-big { font-size: 2rem; font-weight: 800; color: var(--primary); text-shadow: 0 0 15px rgba(187, 134, 252, 0.5); line-height: 1; }
        .pct-label { font-size: 0.8rem; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }
        .progress-track { width: 100%; height: 12px; background: rgba(0,0,0,0.6); border-radius: 6px; border: 1px solid #444; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.6s ease; box-shadow: 0 0 15px rgba(3, 218, 198, 0.5); }

        /* --- GRID DE PERSONAGENS --- */
        .grid-container {
            max-width: 1400px; margin: 0 auto; padding: 20px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 25px;
            width: 100%;
        }

        .char-card {
            background: var(--surface); border: var(--border);
            border-radius: 10px; overflow: hidden;
            display: flex; flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            backdrop-filter: blur(5px);
        }

        .char-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            border-color: rgba(187, 134, 252, 0.3);
            background: var(--surface-hover);
        }
        
        .char-card.dragging {
            opacity: 0.5;
            border: 2px dashed var(--secondary);
            transform: scale(0.95);
        }
        
        .grid-container.draggable-mode .char-card {
            cursor: grab;
        }
        .grid-container.draggable-mode .char-card:active {
            cursor: grabbing;
        }

        .char-header {
            position: relative; height: 90px; background: #000;
            display: flex; align-items: center; padding: 0 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            pointer-events: none; 
        }

        .char-bg-img {
            position: absolute; width: 100%; height: 100%; object-fit: cover;
            opacity: 0.4; mask-image: linear-gradient(to bottom, black, transparent);
            transition: opacity 0.3s;
        }
        .char-card:hover .char-bg-img { opacity: 0.6; }

        .char-avatar {
            width: 60px; height: 60px; border-radius: 50%;
            border: 2px solid var(--primary); z-index: 2; background: #111; object-fit: cover;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .char-details { margin-left: 15px; z-index: 2; display: flex; flex-direction: column; justify-content: center; }
        .char-name { font-weight: 800; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 4px black; line-height: 1; }
        .char-info-row { display: flex; gap: 8px; margin-top: 4px; align-items: center; }
        .char-tag { font-size: 0.7rem; background: var(--secondary); color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .char-atk { font-size: 0.75rem; color: #ffcc00; font-weight: bold; text-shadow: 0 0 5px rgba(255, 204, 0, 0.5); display: flex; align-items: center; gap: 3px; }

        .char-missions { padding: 15px; flex-grow: 1; pointer-events: auto; }

        .cat-title {
            font-size: 0.7rem; color: #888; text-transform: uppercase;
            margin: 15px 0 5px 0; border-bottom: 1px solid #333; padding-bottom: 2px;
            display: flex; justify-content: space-between;
        }
        .cat-title span.reset-info { color: #555; font-size: 0.65rem; font-family: monospace; }

        .mission-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0; transition: 0.2s; opacity: 1;
        }
        .mission-row:hover { background: rgba(255,255,255,0.03); border-radius: 4px; padding-left: 5px; padding-right: 5px; }
        
        .mission-row.done { opacity: 0.4; }
        .mission-row.done span { text-decoration: line-through; }
        
        .mission-name { font-size: 0.85rem; color: #ddd; }

        .pips-container-small { display: flex; gap: 4px; }
        .pip-small {
            width: 14px; height: 14px; border: 1px solid #555; border-radius: 50%; cursor: pointer; transition: all 0.2s; background: rgba(0,0,0,0.3);
        }
        .pip-small:hover { border-color: #fff; transform: scale(1.2); }
        .pip-small.active { background: var(--secondary); border-color: var(--secondary); box-shadow: 0 0 8px var(--secondary); }

        .row-blocked { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        .tag-weekend { color: gold; font-size: 0.7rem; text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #1e1e1e; border: 1px solid var(--secondary);
            padding: 12px 25px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 999; opacity: 0; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-icon { color: var(--secondary); font-size: 1.2rem; }

        footer {
            margin-top: auto; padding: 25px; text-align: center;
            background: #050505; border-top: 1px solid rgba(187, 134, 252, 0.1);
            color: #777; font-size: 0.85rem; letter-spacing: 1px;
        }

/* --- RESPONSIVIDADE PROFISSIONAL (MOBILE) --- */
    @media (max-width: 900px) {
        header { flex-direction: column; gap: 15px; margin-top: 0; padding-bottom: 1rem; }
        .brand { text-align: center; align-items: center; }
        .info-panel { align-items: center; }
        .hero-banner { height: auto; aspect-ratio: 4/3; max-height: 50vh; }
        .main-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .nav-link { justify-content: center; background: rgba(255, 255, 255, 0.05); padding: 12px; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.1); }
        .nav-link:last-child:nth-child(odd) { grid-column: span 2; }
        .controls { width: 100%; justify-content: center; margin-top: 10px; }
        .account-stats-panel { flex-direction: column; gap: 15px; }
        .dashboard-grid { grid-template-columns: 1fr; }
        .grid-container { grid-template-columns: 1fr; padding: 0 15px; }
        .tools-row { flex-direction: column; }
    }
    </style>
</head>

</div>

    <nav class="main-nav">

        <a href="#" class="nav-link active">🚜 <span data-lang="menu_farm">Farm</span></a>
        <a href="../titulos/index.html" class="nav-link">🏆 <span data-lang="menu_titles">Títulos</span></a>
        <a href="../perfil/index.html" class="nav-link">👤 <span data-lang="menu_profile">Perfil</span></a>
    </nav>

    <div class="controls">
       <!-- <button class="btn btn-print" onclick="gerarCardImagem()">📸 <span data-lang="btn_print">IMPRIMIR</span></button> -->
        <button class="btn" onclick="downloadJSON()">💾 <span data-lang="btn_save">SALVAR</span></button>
        <div class="btn btn-load"> 📂 <span data-lang="btn_load">CARREGAR</span>
            <input type="file" id="fileInput" accept=".json" onchange="uploadJSON(this)">
        </div>
    </div>
</header>

<div class="dashboard">
    <div class="dashboard-grid">
        
        <div class="dash-card">
            <h2 data-lang="card_claustro">Claustro Infinito</h2>
            <div class="subtitle" data-lang="sub_claustro">3 Idas por Conta (Diário)</div>
            <div class="pips-container" id="claustro-container"></div>
        </div>

        <div class="dash-card">
            <div class="progress-container">
                <div class="progress-header">
                    <span class="pct-label" data-lang="prog_label">Progresso Atual</span>
                    <span class="pct-big" id="global-pct">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="global-fill"></div>
                </div>
            </div>
        </div>

        <div class="dash-card" style="align-items: flex-start;">
            <h2 data-lang="panel_admin">Painel Admin</h2>
            <div class="subtitle" style="text-align: left; width: 100%;" data-lang="sub_admin">Torre de Controle</div>
            
            <div class="tools-row">
                <div class="tool-group">
                    <label data-lang="label_filter">Exibir Personagem</label>
                    <select id="filter-char" class="dash-select" onchange="renderAll()">
                        <option value="todos" data-lang="opt_all">Todos</option>
                    </select>
                </div>
                <div class="tool-group">
                    <label data-lang="label_sort">Ordenar Por</label>
                    <select id="sort-order" class="dash-select" onchange="changeSort(this.value)">
                        <option value="default" data-lang="sort_default">📜 Lançamento</option>
                        <option value="name" data-lang="sort_name">🏷️ Nome (A-Z)</option>
                        <option value="power" data-lang="sort_power">⚔️ Tipo</option>
                        <option value="custom" data-lang="sort_custom">✨ Personalizado</option>
                    </select>
                </div>
            </div>

            <div class="tools-row">
                <div class="tool-group">
                    <label data-lang="label_batch">Missões em Lote</label>
                    <select id="batch-mission" class="dash-select">
                        <option value="" disabled selected data-lang="opt_select_mission">Selecione a Missão...</option>
                    </select>
                    <div class="action-buttons">
                        <button class="btn-action btn-exec" onclick="executarBatch()" data-lang="btn_batch_done">Concluir Todos</button>
                        <button class="btn-action btn-reset" onclick="resetarBatch()" data-lang="btn_batch_reset">Resetar Todos</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<div class="grid-container" id="char-grid"></div>

<div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <span id="toast-msg">Missão Concluída</span>
</div>

<footer>
    <span data-lang="footer_rights">© 2025 VALHALLA. Todos os direitos reservados.</span>
</footer>

    // --- RELÓGIO ---
    function startClock() {
        const clockEl = document.getElementById('real-time-clock');
        function update() {
            const now = new Date();
            clockEl.innerText = now.toLocaleTimeString('pt-BR');
            if(now.getHours() === 3 && now.getMinutes() === 0 && now.getSeconds() === 0) {
                 checkAndApplyResets(appState.meta.lastSave);
            }
        }
        setInterval(update, 1000);
        update(); 
    }

    // --- RESET LOGIC ---
    function getDailyResetTime() {
        const now = new Date();
        const reset = new Date();
        reset.setHours(3, 0, 0, 0);
        if (now < reset) { reset.setDate(reset.getDate() - 1); }
        return reset.getTime();
    }

    function getWeeklyResetTime(targetDayOfWeek) {
        const now = new Date();
        const reset = new Date();
        reset.setHours(3, 0, 0, 0);
        if (now < reset) { reset.setDate(reset.getDate() - 1); }
        while (reset.getDay() !== targetDayOfWeek) { reset.setDate(reset.getDate() - 1); }
        return reset.getTime();
    }

    function checkAndApplyResets(lastSaveTimestamp) {
        if(!lastSaveTimestamp) lastSaveTimestamp = Date.now();
        let changes = false;
        let messages = [];

        const dailyResetTime = getDailyResetTime();
        if (lastSaveTimestamp < dailyResetTime) {
            appState.account.claustro = 0;
            Object.keys(appState.chars).forEach(k => {
                missoesConfig.diarias.forEach(m => appState.chars[k][m.id] = 0);
                missoesConfig.eventos.forEach(m => appState.chars[k][m.id] = 0);
            });
            changes = true;
            messages.push("Diárias");
        }

        const resetDaysToCheck = [1, 3, 5]; 
        const missionsByDay = {};
        [...missoesConfig.semanais, ...missoesConfig.raids].forEach(m => {
            if(!missionsByDay[m.resetDay]) missionsByDay[m.resetDay] = [];
            missionsByDay[m.resetDay].push(m.id);
        });

        resetDaysToCheck.forEach(day => {
            const weeklyResetTime = getWeeklyResetTime(day);
            if (lastSaveTimestamp < weeklyResetTime) {
                const missionIds = missionsByDay[day] || [];
                if (missionIds.length > 0) {
                    Object.keys(appState.chars).forEach(k => {
                        missionIds.forEach(mId => appState.chars[k][mId] = 0);
                    });
                    changes = true;
                    const diaNome = day === 1 ? "Segunda" : day === 3 ? "Quarta" : "Sexta";
                    messages.push(diaNome);
                }
            }
        });

        if (changes) {
            showToast("Resets automáticos aplicados: " + messages.join(", "));
            appState.meta.lastSave = Date.now(); 
            persist();
            renderAll(); 
        }
        updateSaveDisplay(lastSaveTimestamp);
    }

    // --- SYSTEM ---
    function init() {
        startClock();
        applyLanguage();

        const localData = localStorage.getItem('gcFarmDataV2');
        if (localData) {
            try {
                const parsed = JSON.parse(localData);
                appState = { ...appState, ...parsed };
                // Garantias de integridade para versões antigas
                if(!appState.meta.sortOrder) appState.meta.sortOrder = 'default';
                if(!appState.meta.customOrder) appState.meta.customOrder = [];
                
                checkAndApplyResets(appState.meta.lastSave);
            } catch (e) { console.error("Erro cache", e); }
        } else {
            personagens.forEach(p => {
                if (!appState.chars[p.char]) appState.chars[p.char] = {};
            });
            persist();
        }
        
        document.getElementById('sort-order').value = appState.meta.sortOrder || 'default';

        renderAll();
        initBackground();
    }

    function populateSelectors() {
        const langData = i18n[currentLang];

        // Seletor de Personagem
        const charSelect = document.getElementById('filter-char');
        charSelect.innerHTML = `<option value="todos">${langData['opt_all']}</option>`;
        personagens.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.char;
            opt.textContent = p.nome;
            charSelect.appendChild(opt);
        });

        // Seletor de Batch (Missões)
        const batchSelect = document.getElementById('batch-mission');
        batchSelect.innerHTML = `<option value="" disabled selected>${langData['opt_select_mission']}</option>`;
        const allMissions = [
            ...missoesConfig.diarias, 
            ...missoesConfig.semanais, 
            ...missoesConfig.raids, 
            ...missoesConfig.eventos
        ];
        allMissions.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            // Traduz o nome da missão
            opt.textContent = langData[m.key] || m.label;
            batchSelect.appendChild(opt);
        });
    }

    function persist() {
        localStorage.setItem('gcFarmDataV2', JSON.stringify(appState));
    }

    function registrarAcao() {
        appState.meta.lastSave = Date.now();
        persist();
        updateSaveDisplay(appState.meta.lastSave);
        renderAll();
    }

    function updateSaveDisplay(ts) {
        const date = new Date(ts);
        const formatted = date.toLocaleDateString('pt-BR') + ' ' + date.toLocaleTimeString('pt-BR').slice(0,5);
        const el = document.getElementById('last-save-display');
        if(el) el.innerHTML = `Memória Cache: <span>${formatted}</span>`;
    }

    function downloadJSON() {
        appState.meta.lastSave = Date.now();
        persist();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `farm_gc_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
        showToast("Arquivo JSON salvo!");
        updateSaveDisplay(appState.meta.lastSave);
    }

    function uploadJSON(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const json = JSON.parse(e.target.result);
                appState = { ...appState, ...json };
                checkAndApplyResets(json.meta.lastSave || Date.now()); 
                renderAll();
                showToast("Dados carregados com sucesso!");
                persist();
            } catch(err) {
                alert("Erro ao ler JSON");
            }
        };
        reader.readAsText(file);
    }

    // --- INTEGRAÇÃO COM PERFIL ---
    function getAtkFromProfile(charKey) {
        try {
            const perfilDataStr = localStorage.getItem('valhalla_perfil_v6');
            if(!perfilDataStr) return null;
            const perfilData = JSON.parse(perfilDataStr);
            const charProfile = perfilData.perfil.find(p => p.char === charKey);
            
            if(charProfile && charProfile.atkTotal && charProfile.atkTotal !== "0") {
                let num = parseFloat(charProfile.atkTotal.replace(/[^0-9]/g, ''));
                if(num > 1000000) return (num/1000000).toFixed(1) + 'M';
                if(num > 1000) return (num/1000).toFixed(0) + 'k';
                return num;
            }
        } catch(e) { return null; }
        return null;
    }

    // --- CALCULO DE PROGRESSO INTELIGENTE ---
    function updateGlobalProgress() {
        let maxPoints = 3; 
        let currentPoints = parseInt(appState.account.claustro) || 0;
        
        const today = new Date().getDay();
        const isWeekend = (today === 0 || today === 5 || today === 6);

        personagens.forEach(p => {
            const charData = appState.chars[p.char] || {};
            [...missoesConfig.diarias, ...missoesConfig.semanais, ...missoesConfig.raids].forEach(m => {
                maxPoints += m.max;
                currentPoints += (parseInt(charData[m.id]) || 0);
            });
            if(isWeekend) {
                missoesConfig.eventos.forEach(m => {
                    maxPoints += m.max;
                    currentPoints += (parseInt(charData[m.id]) || 0);
                });
            }
        });

        const percent = maxPoints > 0 ? Math.round((currentPoints / maxPoints) * 100) : 0;
        document.getElementById('global-pct').innerText = `${percent}%`;
        const fill = document.getElementById('global-fill');
        fill.style.width = `${percent}%`;
        if(percent === 100) fill.style.background = '#03dac6'; 
        else fill.style.background = 'linear-gradient(90deg, var(--primary), var(--secondary))';
    }

    // --- ORDENAÇÃO E DRAG & DROP ---
    function changeSort(order) {
        appState.meta.sortOrder = order;
        persist();
        renderAll();
    }

    function getSortedChars() {
        let list = [...personagens];
        const order = appState.meta.sortOrder || 'default';

        if(order === 'name') {
            list.sort((a, b) => a.nome.localeCompare(b.nome));
        } else if(order === 'power') {
            list.sort((a, b) => a.power.localeCompare(b.power));
        } else if(order === 'custom') {
            const orderMap = new Map();
            if(!appState.meta.customOrder) appState.meta.customOrder = [];
            
            personagens.forEach(p => {
                if(!appState.meta.customOrder.includes(p.char)) appState.meta.customOrder.push(p.char);
            });

            appState.meta.customOrder.forEach((charKey, index) => {
                orderMap.set(charKey, index);
            });

            list.sort((a, b) => {
                const idxA = orderMap.has(a.char) ? orderMap.get(a.char) : 999;
                const idxB = orderMap.has(b.char) ? orderMap.get(b.char) : 999;
                return idxA - idxB;
            });
        }
        return list;
    }

    // --- LÓGICA DE DRAG & DROP ---
    let draggedItem = null;

    function handleDragStart(e) {
        draggedItem = this;
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/html', this.innerHTML);
    }

    function handleDragOver(e) {
        if (e.preventDefault) e.preventDefault(); 
        e.dataTransfer.dropEffect = 'move';
        return false;
    }

    function handleDrop(e) {
        if (e.stopPropagation) e.stopPropagation(); 
        
        if (draggedItem !== this) {
            const sourceChar = draggedItem.getAttribute('data-char');
            const targetChar = this.getAttribute('data-char');
            
            let order = appState.meta.customOrder;
            const fromIndex = order.indexOf(sourceChar);
            const toIndex = order.indexOf(targetChar);

            if (fromIndex >= 0 && toIndex >= 0) {
                order.splice(fromIndex, 1);
                order.splice(toIndex, 0, sourceChar);
                appState.meta.customOrder = order;
                registrarAcao(); 
            }
        }
        return false;
    }

    function handleDragEnd(e) {
        this.classList.remove('dragging');
    }

    // --- FUNÇÕES BATCH ---
    function executarBatch() {
        const missionId = document.getElementById('batch-mission').value;
        if(!missionId) { showToast("Selecione uma missão!"); return; }

        const allMissions = [...missoesConfig.diarias, ...missoesConfig.semanais, ...missoesConfig.raids, ...missoesConfig.eventos];
        const missionInfo = allMissions.find(m => m.id === missionId);

        const today = new Date().getDay();
        const isWeekend = (today === 5 || today === 6 || today === 0);
        if(missionInfo.isWeekend && !isWeekend) {
            showToast("Missão disponível apenas FDS!");
            return;
        }

        Object.keys(appState.chars).forEach(charKey => {
            appState.chars[charKey][missionId] = missionInfo.max;
        });

        registrarAcao();
        // Usar nome traduzido no toast
        const label = i18n[currentLang][missionInfo.key] || missionInfo.label;
        showToast(`Todos completaram: ${label}`);
    }

    function resetarBatch() {
        const missionId = document.getElementById('batch-mission').value;
        if(!missionId) { showToast("Selecione uma missão para resetar!"); return; }

        const allMissions = [...missoesConfig.diarias, ...missoesConfig.semanais, ...missoesConfig.raids, ...missoesConfig.eventos];
        const missionInfo = allMissions.find(m => m.id === missionId);

        Object.keys(appState.chars).forEach(charKey => {
            appState.chars[charKey][missionId] = 0;
        });

        registrarAcao();
        const label = i18n[currentLang][missionInfo.key] || missionInfo.label;
        showToast(`Resetado: ${label}`);
    }

    // --- RENDER ---
    function renderAll() {
        const clContainer = document.getElementById('claustro-container');
        if(clContainer) {
            clContainer.innerHTML = '';
            for(let i=1; i<=3; i++) {
                const active = i <= appState.account.claustro ? 'active' : '';
                clContainer.innerHTML += `<div class="pip ${active}" onclick="toggleClaustro(${i})"></div>`;
            }
        }

        const grid = document.getElementById('char-grid');
        grid.innerHTML = '';
        
        const today = new Date().getDay();
        const isWeekend = (today === 5 || today === 6 || today === 0);
        const filterChar = document.getElementById('filter-char').value;
        const sortOrder = appState.meta.sortOrder;
        const langData = i18n[currentLang];

        if(sortOrder === 'custom' && filterChar === 'todos') {
            grid.classList.add('draggable-mode');
        } else {
            grid.classList.remove('draggable-mode');
        }

        const charList = getSortedChars();

        charList.forEach(p => {
            if(filterChar !== 'todos' && p.char !== filterChar) return;

            if(!appState.chars[p.char]) appState.chars[p.char] = {};
            const atkTotal = getAtkFromProfile(p.char);
            const atkBadge = atkTotal ? `<div class="char-atk">⚔️ ${atkTotal}</div>` : '';

            const card = document.createElement('div');
            card.className = 'char-card';
            card.setAttribute('data-char', p.char);
            
            if(sortOrder === 'custom' && filterChar === 'todos') {
                card.setAttribute('draggable', 'true');
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragend', handleDragEnd);
            }

            card.innerHTML = `
                <div class="char-header">
                    <img src="../imagens/personagens/${p.char}.png" class="char-bg-img" onerror="this.style.display='none'">
                    <img src="../imagens/personagens/${p.char}.png" class="char-avatar" onerror="this.src='https://placehold.co/60x60/111/FFF?text=?'">
                    <div class="char-details">
                        <div class="char-name">${p.nome}</div>
                        <div class="char-info-row">
                            <span class="char-tag">${p.power}</span>
                            ${atkBadge}
                        </div>
                    </div>
                </div>
                <div class="char-missions">
                    <div class="cat-title">${langData['cat_daily']} <span class="reset-info">${langData['reset_daily']}</span></div>
                    ${missoesConfig.diarias.map(m => renderMissionRow(p.char, m)).join('')}
                    <div class="cat-title">${langData['cat_weekly']} <span class="reset-info">${langData['reset_weekly']}</span></div>
                    ${missoesConfig.semanais.map(m => renderMissionRow(p.char, m)).join('')}
                    <div class="cat-title">${langData['cat_raid']} <span class="reset-info">${langData['reset_raid']}</span></div>
                    ${missoesConfig.raids.map(m => renderMissionRow(p.char, m)).join('')}
                    <div class="cat-title">${langData['cat_event']} <span class="reset-info">${langData['reset_event']}</span></div>
                    ${missoesConfig.eventos.map(m => renderMissionRow(p.char, m, isWeekend)).join('')}
                </div>`;
            
            grid.appendChild(card);
        });

        updateGlobalProgress();
    }

    function renderMissionRow(charKey, mission, isWeekendOpen = true) {
        const val = parseInt(appState.chars[charKey][mission.id]) || 0;
        const isDone = val >= mission.max;
        const blockedClass = (mission.isWeekend && !isWeekendOpen) ? 'row-blocked' : '';
        const weekendTag = (mission.isWeekend && !isWeekendOpen) ? '<span style="font-size:0.6rem; margin-left:5px">(Fechado)</span>' : '';
        
        // Nome traduzido
        const label = i18n[currentLang][mission.key] || mission.label;

        let pips = '';
        for(let i=1; i<=mission.max; i++) {
            const active = i <= val ? 'active' : '';
            pips += `<div class="pip-small ${active}" onclick="toggleMission('${charKey}', '${mission.id}', ${i}, '${label}')"></div>`;
        }
        return `<div class="mission-row ${isDone ? 'done' : ''} ${blockedClass}">
            <span class="mission-name ${mission.isWeekend ? 'tag-weekend':''}">${label}${weekendTag}</span>
            <div class="pips-container-small">${pips}</div></div>`;
    }

    function toggleClaustro(val) {
        if(appState.account.claustro === val) appState.account.claustro = val - 1;
        else { appState.account.claustro = val; showToast("Claustro: OK!"); }
        registrarAcao(); 
    }

    function toggleMission(charKey, mId, val, label) {
        const current = appState.chars[charKey][mId] || 0;
        if(current === val) appState.chars[charKey][mId] = val - 1; 
        else { appState.chars[charKey][mId] = val; showToast(`${label} OK!`); }
        registrarAcao();
    }

    // --- NOVO: GERAR CARD (PRINT) ---
    function gerarCardImagem() {
        const area = document.body; 
        const btn = document.querySelector('.btn-print');
        const oldText = btn.innerText;
        btn.innerText = "⏳ ...";
        
        html2canvas(document.querySelector('.grid-container'), {
            backgroundColor: "#0b0b0b", 
            scale: 2
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Valhalla_Farm_${new Date().toISOString().slice(0,10)}.png`;
            link.href = canvas.toDataURL();
            link.click();
            btn.innerText = oldText;
        }).catch(err => {
            console.error(err);
            alert("Erro ao gerar imagem.");
            btn.innerText = oldText;
        });
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        const tm = document.getElementById('toast-msg');
        tm.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    // --- BG ANIMATION ---
    function initBackground() {
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class Particle {
            constructor() {
                this.x = Math.random() * width; this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if(this.x < 0 || this.x > width) this.vx *= -1;
                if(this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() { ctx.fillStyle = 'rgba(187, 134, 252, 0.3)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        for(let i=0; i<60; i++) particles.push(new Particle());
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update(); p.draw();
                particles.forEach(p2 => {
                    const dx = p.x - p2.x; const dy = p.y - p2.y; const dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 100) { ctx.strokeStyle = `rgba(187, 134, 252, ${0.1 - dist/1000})`; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
                });
            });
            requestAnimationFrame(animate);
        }
        animate();
    }
    init();
</script>
