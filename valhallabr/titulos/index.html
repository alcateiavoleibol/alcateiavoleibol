<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TÍTULOS</title>
  <link rel="icon" type="image/png" href="../imagens/favicon/favicon.png">
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  
  <style>
    /* --- CONFIGURAÇÕES GERAIS --- */
    :root {
      --primary: #bb86fc;
      --secondary: #03dac6;
      --bg: #0b0b0b;
      --surface: rgba(30, 30, 30, 0.7);
      --surface-hover: rgba(50, 50, 50, 0.9);
      --border: 1px solid rgba(255, 255, 255, 0.15);
      --glass: rgba(15, 15, 15, 0.95);
      
      /* Cores de Raridade */
      --normal: #a0a0a0;    /* Cinza */
      --rare: #00bfff;      /* Azul */
      --epic: #ffd700;      /* Amarelo */
      --legendary: #b026ff; /* Roxo */
      --ancestral: #ff1493; /* Rosa */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    body {
      background-color: var(--bg);
      color: #e0e0e0;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex; flex-direction: column;
    }

    /* --- FUNDO ANIMADO --- */
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%); }

    /* --- HERO BANNER (PC) --- */
    .hero-banner {
      width: 100%; height: 350px; position: relative; overflow: hidden;
      background: #020202; display: flex; align-items: center; justify-content: center;
      border-bottom: 1px solid rgba(187, 134, 252, 0.2); box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .hero-banner img { width: 100%; height: 100%; object-fit: contain; object-position: center center; display: block; }
    
    /* Efeito Scanner */
    .hero-banner::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(to right, transparent 0%, rgba(255, 255, 255, 0.05) 20%, rgba(255, 255, 255, 0.2) 50%, rgba(255, 255, 255, 0.05) 80%, transparent 100%);
      transform: skewX(-25deg); animation: scanLight 6s ease-in-out infinite; pointer-events: none;
    }
    @keyframes scanLight { 0% { left: -100%; opacity: 0; } 20% { opacity: 1; } 50% { left: 200%; opacity: 0; } 100% { left: 200%; opacity: 0; } }

    /* --- HEADER --- */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--glass); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(187, 134, 252, 0.2);
      padding: 0.8rem 2rem; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 30px rgba(0,0,0,0.6);
    }
    
    .brand { display: flex; flex-direction: column; min-width: 180px; }
    .brand h1 {
        font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px;
        background: linear-gradient(90deg, #fff, var(--primary)); 
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        margin: 0; text-shadow: 0 2px 10px rgba(187, 134, 252, 0.3);
    }
    .brand h3 { margin: 0; color: #aaa; font-size: 0.9rem; letter-spacing: 4px; text-transform: uppercase; margin-top: -5px; }
    .info-panel { font-size: 0.75rem; display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }
    .cache-info { color: #888; }
    .cache-info span { color: var(--primary); font-weight: bold; }
    .time-info { color: #aaa; font-size: 0.8rem; display: flex; align-items: center; gap: 5px;}
    .real-time { color: var(--secondary); font-weight: 800; font-variant-numeric: tabular-nums; text-shadow: 0 0 5px rgba(3, 218, 198, 0.4); }

    .main-nav { display: flex; gap: 15px; }
    .nav-link {
        text-decoration: none; color: #ccc; font-weight: 700; text-transform: uppercase; font-size: 1.4rem;
        padding: 8px 16px; border-radius: 4px; transition: 0.3s; display: flex; align-items: center; gap: 6px;
        border-bottom: 2px solid transparent;
    }
    .nav-link:hover, .nav-link.active {
        color: #fff; text-shadow: 0 0 10px var(--secondary); border-bottom: 2px solid var(--secondary);
        background: rgba(255, 255, 255, 0.05);
    }

    .controls { display: flex; gap: 10px; align-items: center; min-width: 180px; justify-content: flex-end; }
    .btn {
        background: rgba(255,255,255,0.05); border: 1px solid var(--primary); color: var(--primary);
        padding: 8px 15px; cursor: pointer; border-radius: 4px; transition: 0.3s; font-size: 0.8rem; font-weight: bold; text-transform: uppercase;
    }
    .btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
    
    .btn-load { position: relative; overflow: hidden; border-color: var(--secondary); color: var(--secondary); }
    .btn-load:hover { background: var(--secondary); color: #000; box-shadow: 0 0 15px var(--secondary); border-color: var(--secondary); }
    .btn-load input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

    .btn-print { border-color: #fff; color: #fff; }
    .btn-print:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }

    /* --- FILTRO SUPERIOR --- */
    .filter-wrapper {
        display: flex; justify-content: center; align-items: center; gap: 15px; 
        margin: 30px auto; padding: 20px;
        background: var(--surface); border-radius: 50px; border: var(--border);
        width: fit-content; backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .filter-group { display: flex; flex-direction: column; }
    .filter-group label { font-size: 0.7rem; color: #aaa; margin-left: 10px; margin-bottom: 2px; text-transform: uppercase; }
    .filter-select {
        background: rgba(0,0,0,0.6); border: 1px solid #444; color: #fff;
        padding: 10px 20px; border-radius: 20px; font-size: 0.9rem; width: 220px;
        cursor: pointer; text-align: center;
    }
    .filter-select:focus { border-color: var(--primary); outline: none; }

    /* --- GRID DE PERSONAGENS --- */
    .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(750px, 1fr)); 
        gap: 30px;
        width: 100%; max-width: 1800px;
        margin: 0 auto 40px auto; padding: 0 30px;
    }

    .char-card {
        background: var(--surface); border: var(--border);
        border-radius: 12px; overflow: hidden;
        display: flex; flex-direction: column;
        transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        backdrop-filter: blur(10px); position: relative;
    }
    .char-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 50px rgba(0,0,0,0.6);
        border-color: var(--secondary);
    }

    /* DRAG STYLES */
    .grid-container.draggable-mode .char-card { cursor: grab; }
    .grid-container.draggable-mode .char-card:active { cursor: grabbing; }
    .char-card.dragging { 
        opacity: 0.5; border: 2px dashed var(--secondary); transform: scale(0.98); 
    }

    /* Cabeçalho do Card */
    .char-header {
        background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(30,30,30,0.9) 100%);
        padding: 25px; display: flex; align-items: center; gap: 20px;
        border-bottom: 1px solid rgba(255,255,255,0.1); position: relative; pointer-events: none;
    }
    .avatar { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; box-shadow: 0 0 15px rgba(187, 134, 252, 0.4); }
    .char-info { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
    .char-name { font-size: 1.4rem; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px; line-height: 1.1; }
    
    .char-atk-badge {
        display: inline-flex; align-items: center; gap: 5px;
        background: rgba(255, 204, 0, 0.1); border: 1px solid rgba(255, 204, 0, 0.3);
        color: #ffcc00; padding: 2px 8px; border-radius: 4px;
        font-size: 0.85rem; font-weight: bold; margin-top: 5px; width: fit-content;
        text-shadow: 0 0 5px rgba(255, 204, 0, 0.3);
    }

    .equipped-slot {
        width: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        border-left: 1px solid rgba(255,255,255,0.1); padding-left: 15px; min-height: 80px;
        pointer-events: auto;
    }
    .equipped-img { width: 70px; height: 70px; object-fit: contain; filter: drop-shadow(0 0 5px var(--secondary)); }
    .equipped-label { font-size: 0.75rem; color: var(--secondary); text-align: center; line-height: 1.2; margin-top: 5px; font-weight: bold; }
    .placeholder-text { font-size: 0.75rem; color: #555; font-style: italic; }

    .titles-grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 25px; justify-content: center; min-height: 180px; align-content: flex-start; pointer-events: auto; }
    .title-item {
        width: 60px; height: 60px; border-radius: 10px; border: 1px solid transparent; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.3); transition: 0.2s; position: relative;
    }
    .title-item img { width: 100%; height: 100%; object-fit: contain; opacity: 0.2; filter: grayscale(1); transition: 0.3s; }
    .title-item:hover { background: rgba(255,255,255,0.05); transform: scale(1.15); z-index: 2; }
    .title-item:hover img { opacity: 0.8; }
    .title-item.obtained img { opacity: 1; filter: grayscale(0); }
    .title-item.obtained { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
    .title-item.equipped { border-color: var(--secondary); box-shadow: 0 0 15px rgba(3, 218, 198, 0.25); background: rgba(3, 218, 198, 0.05); }
    .title-item.equipped img { opacity: 1; filter: drop-shadow(0 0 5px var(--secondary)); }

    /* Tooltip */
    #tooltip {
        position: fixed; display: none; z-index: 9999; pointer-events: none;
        background: rgba(10, 12, 16, 0.98); border: 2px solid #333;
        border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        min-width: 320px; max-width: 380px; color: #eee; font-size: 0.9rem;
    }
    .tt-header { padding: 12px 15px; background: linear-gradient(90deg, rgba(30,30,30,0.8), transparent); border-bottom: 1px solid rgba(255,255,255,0.1); border-radius: 6px 6px 0 0; }
    .tt-name { font-weight: 800; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
    .tt-meta { font-size: 0.75rem; color: #aaa; margin-top: 2px; display: flex; justify-content: space-between; }
    .rarity-normal { border-top: 3px solid var(--normal); } .rarity-normal .tt-name { color: var(--normal); }
    .rarity-raro { border-top: 3px solid var(--rare); } .rarity-raro .tt-name { color: var(--rare); text-shadow: 0 0 10px rgba(0, 191, 255, 0.4); }
    .rarity-epico { border-top: 3px solid var(--epic); } .rarity-epico .tt-name { color: var(--epic); text-shadow: 0 0 10px rgba(255, 215, 0, 0.4); }
    .rarity-lendario { border-top: 3px solid var(--legendary); } .rarity-lendario .tt-name { color: var(--legendary); text-shadow: 0 0 10px rgba(176, 38, 255, 0.4); }
    .rarity-ancestral { border-top: 3px solid var(--ancestral); } .rarity-ancestral .tt-name { color: var(--ancestral); text-shadow: 0 0 10px rgba(255, 20, 147, 0.4); }
    .tt-body { padding: 15px; }
    .tt-stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; }
    .tt-stat { display: flex; flex-direction: column; align-items: center; }
    .tt-stat-val { font-weight: bold; font-size: 1rem; color: #fff; }
    .tt-stat-label { font-size: 0.65rem; color: #aaa; text-transform: uppercase; }
    .tt-effects { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .tt-effect-row { display: flex; align-items: flex-start; gap: 8px; color: #ddd; font-size: 0.85rem; line-height: 1.3; }
    .tt-bullet { color: var(--secondary); font-size: 1rem; line-height: 1; }
    .tt-notes { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; color: #888; font-style: italic; }
    .tt-note-item { margin-bottom: 4px; display: block; }
    .tt-fallback-img { width: 100%; display: block; border-radius: 8px; }

    footer { margin-top: auto; padding: 25px; text-align: center; background: #050505; border-top: 1px solid rgba(187, 134, 252, 0.1); color: #777; font-size: 0.85rem; letter-spacing: 1px; width: 100%; }

    @media (max-width: 900px) {
        header { flex-direction: column; gap: 15px; margin-top: 0; padding-bottom: 1rem; }
        .brand { text-align: center; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .info-panel { align-items: center; display: flex; flex-direction: column; margin-top: 5px; }
        .hero-banner { height: auto; aspect-ratio: 4/3; max-height: 50vh; }
        .main-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .nav-link { justify-content: center; background: rgba(255, 255, 255, 0.08); font-size: 0.9rem; padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); width: auto; }
        .nav-link:last-child:nth-child(odd) { grid-column: span 2; }
        .controls { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        .btn, .btn-load, .btn-print { width: 100%; justify-content: center; }
        .filter-wrapper { width: 95%; padding: 10px; flex-direction: column; gap: 10px; align-items: stretch; }
        .filter-select { flex-grow: 1; width: 100%; } .filter-group label { text-align: center; }
        .grid-container { grid-template-columns: 1fr; padding: 0 15px; }
        .char-header { flex-direction: column; text-align: center; gap: 10px; background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.9) 100%); }
        .char-info { margin-bottom: 5px; } .char-atk-badge { margin: 5px auto 0 auto; }
        .equipped-slot { width: 100%; border-left: none; border-top: 1px solid rgba(255, 255, 255, 0.15); padding-left: 0; padding-top: 15px; margin-top: 5px; background: rgba(255, 255, 255, 0.02); border-radius: 8px; }
        .titles-grid { gap: 15px; } .title-item { width: 55px; height: 55px; }
        #tooltip { max-width: 90%; width: 90%; left: 50% !important; top: 50% !important; transform: translate(-50%, -50%); font-size: 0.85rem; pointer-events: none; }
    }
  </style>
</head>

    // Função que varre a string e substitui termos conhecidos
    function smartTranslate(text) {
        if(currentLang === 'pt') return text; // Se for PT, retorna original
        
        // Primeiro, verifica correspondência exata (para nomes de títulos)
        if(dictionary[text] && dictionary[text][currentLang]) {
            return dictionary[text][currentLang];
        }

        // Se não, faz substituição parcial (para efeitos e notas)
        let translated = text;
        for (const [key, transObj] of Object.entries(dictionary)) {
            if (translated.includes(key) && transObj[currentLang]) {
                translated = translated.replace(key, transObj[currentLang]);
            }
        }
        return translated;
    }

    // --- LÓGICA DE PARTÍCULAS ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particlesArray = [];
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', () => { resize(); initParticles(); });
    resize();
    class Particle {
      constructor() {
        this.x = Math.random() * width; this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 2;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if(this.x < 0 || this.x > width) this.vx *= -1;
        if(this.y < 0 || this.y > height) this.vy *= -1;
      }
      draw() { ctx.fillStyle = 'rgba(187, 134, 252, 0.3)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
    }
    function initParticles() { particlesArray = []; for(let i=0; i<60; i++) particlesArray.push(new Particle()); }
    function animateParticles() {
      ctx.clearRect(0, 0, width, height);
      particlesArray.forEach(p => {
        p.update(); p.draw();
        particlesArray.forEach(p2 => {
          const dx = p.x - p2.x; const dy = p.y - p2.y; const dist = Math.sqrt(dx*dx + dy*dy);
          if(dist < 100) {
            ctx.strokeStyle = `rgba(187, 134, 252, ${0.1 - dist/1000})`; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
          }
        });
      });
      requestAnimationFrame(animateParticles);
    }
    initParticles(); animateParticles();

    // --- INTEGRAÇÃO COM PERFIL (ATAQUE TOTAL) ---
    function getAtkFromProfile(charKey) {
        try {
            const perfilDataStr = localStorage.getItem('valhalla_perfil_v6');
            if(!perfilDataStr) return null;
            const perfilData = JSON.parse(perfilDataStr);
            const charProfile = perfilData.perfil.find(p => p.char === charKey);
            
            if(charProfile && charProfile.atkTotal && charProfile.atkTotal !== "0") {
                let num = parseFloat(charProfile.atkTotal.replace(/[^0-9]/g, ''));
                if(num > 1000000) return (num/1000000).toFixed(1) + 'M';
                if(num > 1000) return (num/1000).toFixed(0) + 'k';
                return num;
            }
        } catch(e) { return null; }
        return null;
    }

    function getSortedChars() {
        let list = [...dadosIniciais];
        const order = appData.meta.sortOrder;

        if(order === 'name') {
            list.sort((a, b) => a.nome.localeCompare(b.nome));
        } else if(order === 'custom') {
            const orderMap = new Map();
            if(!appData.meta.customOrder) appData.meta.customOrder = [];
            
            dadosIniciais.forEach(p => {
                if(!appData.meta.customOrder.includes(p.char)) appData.meta.customOrder.push(p.char);
            });

            appData.meta.customOrder.forEach((charKey, index) => {
                orderMap.set(charKey, index);
            });

            list.sort((a, b) => {
                const idxA = orderMap.has(a.char) ? orderMap.get(a.char) : 999;
                const idxB = orderMap.has(b.char) ? orderMap.get(b.char) : 999;
                return idxA - idxB;
            });
        }
        return list;
    }

    let draggedItem = null;

    function handleDragStart(e) {
        draggedItem = this;
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/html', this.innerHTML);
    }

    function handleDragOver(e) {
        if (e.preventDefault) e.preventDefault(); 
        e.dataTransfer.dropEffect = 'move';
        return false;
    }

    function handleDrop(e) {
        if (e.stopPropagation) e.stopPropagation(); 
        
        if (draggedItem !== this) {
            const sourceChar = draggedItem.getAttribute('data-char');
            const targetChar = this.getAttribute('data-char');
            
            let order = appData.meta.customOrder;
            const fromIndex = order.indexOf(sourceChar);
            const toIndex = order.indexOf(targetChar);

            if (fromIndex >= 0 && toIndex >= 0) {
                order.splice(fromIndex, 1);
                order.splice(toIndex, 0, sourceChar);
                appData.meta.customOrder = order;
                persist();
                renderAll(); 
            }
        }
        return false;
    }

    function handleDragEnd(e) {
        this.classList.remove('dragging');
    }

            const titulosOrdenados = [...listaTitulos].sort((a, b) => {
                const slugA = a.replace('.png', '');
                const slugB = b.replace('.png', '');
                if (slugA === equipadoSlug) return -1;
                if (slugB === equipadoSlug) return 1;
                const hasA = obtidosSet.has(slugA);
                const hasB = obtidosSet.has(slugB);
                if (hasA && !hasB) return -1;
                if (!hasA && hasB) return 1;
                
                // Tradução do Nome no Sorting
                const dbA = titleDatabase[slugA];
                const dbB = titleDatabase[slugB];
                const nomeA = dbA ? smartTranslate(dbA.name) : slugA;
                const nomeB = dbB ? smartTranslate(dbB.name) : slugB;
                
                return nomeA.localeCompare(nomeB);
            });

            const card = document.createElement('div');
            card.className = 'char-card';
            card.dataset.char = p.char;
            
            // Drag Events
            if(sortOrder === 'custom' && filterChar === 'todos') {
                card.setAttribute('draggable', 'true');
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragend', handleDragEnd);
            }

            // Tradução do "Nenhum"
            let equippedHtml = `<div class="placeholder-text">${langData.txt_none}</div>`;
            if(equipadoSlug) {
                const dbInfo = titleDatabase[equipadoSlug];
                const realName = dbInfo ? smartTranslate(dbInfo.name) : equipadoSlug;
                equippedHtml = `
                    <img src="../imagens/titulos/${equipadoSlug}.png" class="equipped-img" onerror="this.style.display='none'">
                    <div class="equipped-label">${realName}</div>
                `;
            }

            const header = document.createElement('div');
            header.className = 'char-header';
            header.innerHTML = `
                <img src="../imagens/personagens/${p.char}.png" class="avatar" onerror="this.src='https://placehold.co/80x80/333/FFF?text=?'">
                <div class="char-info">
                    <div class="char-name">${p.nome}</div>
                    ${atkBadge}
                </div>
                <div class="equipped-slot" id="eq-slot-${p.char}">${equippedHtml}</div>
            `;
            card.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'titles-grid';

            titulosOrdenados.forEach(file => {
                const slug = file.replace('.png','');
                const isObtained = obtidosSet.has(slug);
                const isEquipped = (slug === equipadoSlug);

                const item = document.createElement('div');
                item.className = `title-item ${isObtained ? 'obtained' : ''} ${isEquipped ? 'equipped' : ''}`;
                
                item.onclick = (e) => toggleTitle(p.char, slug, e);
                item.oncontextmenu = (e) => { e.preventDefault(); if(isObtained) equipTitle(p.char, slug); };
                item.onmouseenter = (e) => showTooltip(e, slug);
                item.onmouseleave = hideTooltip;
                item.onmousemove = (e) => moveTooltip(e);

                item.innerHTML = `<img src="../imagens/titulos/${file}" alt="${slug}">`;
                grid.appendChild(item);
            });

            card.appendChild(grid);
            container.appendChild(card);
        });
    }

    // --- INTERAÇÕES ---
    function toggleTitle(charKey, slug, e) {
        if(e.ctrlKey) { equipTitle(charKey, slug); return; }
        const data = appData.chars[charKey];
        const idx = data.obtidos.indexOf(slug);
        if(idx > -1) {
            data.obtidos.splice(idx, 1);
            if(data.equipado === slug) data.equipado = null; 
        } else { data.obtidos.push(slug); }
        persist(); renderAll();
    }

    function equipTitle(charKey, slug) {
        const data = appData.chars[charKey];
        if(!data.obtidos.includes(slug)) return;
        if(data.equipado === slug) data.equipado = null; 
        else data.equipado = slug; 
        persist(); renderAll();
    }

    // --- TOOLTIP HYBRIDO (TRADUÇÃO APLICADA) ---
    const tooltip = document.getElementById('tooltip');

    function showTooltip(e, slug) {
        const dbData = titleDatabase[slug];
        const langData = i18n[currentLang];
        let htmlContent = '';

        if(dbData) {
            // Aplica a tradução inteligente nos dados
            const displayName = smartTranslate(dbData.name);
            const displayEffects = dbData.effects.map(ef => smartTranslate(ef));
            const displayNotes = dbData.notes ? dbData.notes.map(n => smartTranslate(n)) : [];
            
            const notesHtml = displayNotes.length ? 
                `<div class="tt-notes">${displayNotes.map(n => `<span class="tt-note-item">${n}</span>`).join('')}</div>` : '';

            htmlContent = `
                <div class="tt-content">
                    <div class="tt-header rarity-${dbData.rarity}">
                        <div class="tt-name">${displayName}</div>
                        <div class="tt-meta">
                            <span>${langData.txt_level} ${dbData.level}</span>
                            <span>${translateRarity(dbData.rarity)}</span>
                        </div>
                    </div>
                    <div class="tt-body">
                        <div class="tt-stats-grid">
                            <div class="tt-stat"><span class="tt-stat-val">${dbData.stats.atk}</span><span class="tt-stat-label">${langData.txt_atk}</span></div>
                            <div class="tt-stat"><span class="tt-stat-val">${dbData.stats.def}</span><span class="tt-stat-label">${langData.txt_def}</span></div>
                            <div class="tt-stat"><span class="tt-stat-val">${dbData.stats.hp}</span><span class="tt-stat-label">${langData.txt_hp}</span></div>
                        </div>
                        <div class="tt-effects">
                            ${displayEffects.map(ef => `<div class="tt-effect-row"><span class="tt-bullet">◆</span> ${ef}</div>`).join('')}
                        </div>
                        ${notesHtml}
                    </div>
                </div>
            `;
        } else {
            // Fallback para imagem
            htmlContent = `<img src="../imagens/titulos-descricao/${slug}.png" class="tt-fallback-img" onerror="this.style.display='none'">`;
        }

        tooltip.innerHTML = htmlContent;
        tooltip.style.display = 'block';
        
        if(window.innerWidth < 768) {
             tooltip.style.left = '50%';
             tooltip.style.top = '50%';
             tooltip.style.transform = 'translate(-50%, -50%)';
        } else {
             tooltip.style.transform = 'none';
             moveTooltip(e);
        }
    }

    function hideTooltip() { tooltip.style.display = 'none'; }
    
    function moveTooltip(e) {
        if(window.innerWidth >= 768) {
             tooltip.style.left = (e.clientX + 15) + 'px';
             tooltip.style.top = (e.clientY + 15) + 'px';
        }
    }

    // --- NOVO: GERAR CARD (PRINT) ---
    function gerarCardImagem() {
        const btn = document.querySelector('.btn-print');
        const oldText = btn.innerText;
        btn.innerText = "⏳ ...";
        
        html2canvas(document.querySelector('.grid-container'), {
            backgroundColor: "#0b0b0b", 
            scale: 2 
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Valhalla_Titulos_${new Date().toISOString().slice(0,10)}.png`;
            link.href = canvas.toDataURL();
            link.click();
            btn.innerText = oldText;
        }).catch(err => {
            console.error(err);
            alert("Erro ao gerar imagem.");
            btn.innerText = oldText;
        });
    }

    // --- PERSISTÊNCIA ---
    function persist() {
        appData.meta.dataHora = Date.now();
        localStorage.setItem(CACHE_KEY, JSON.stringify(appData));
        updateSaveDisplay(appData.meta.dataHora);
    }

    function updateSaveDisplay(ts) {
        const date = new Date(ts);
        const formatted = date.toLocaleDateString('pt-BR') + ' ' + date.toLocaleTimeString('pt-BR').slice(0,5);
        document.getElementById('last-save-display').innerHTML = `Memória Cache: <span>${formatted}</span>`;
    }

    function salvarTitulos() {
        persist();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `titulos_valhalla_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
    }

    function carregarArquivo(input) {
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const json = JSON.parse(e.target.result);
                if(Array.isArray(json.perfil)) {
                    appData = { meta: { sortOrder: 'default', customOrder: [] }, chars: {} };
                    json.perfil.forEach(p => {
                        const charObj = dadosIniciais.find(d => d.birth === p.birth);
                        if(charObj) {
                            appData.chars[charObj.char] = { 
                                obtidos: p.titulos || [], 
                                equipado: p.equipado 
                            };
                        }
                    });
                } else {
                    appData = json;
                    if(!appData.meta) appData.meta = { sortOrder: 'default', customOrder: [] };
                }
                
                document.getElementById('sort-order').value = appData.meta.sortOrder || 'default';
                persist(); renderAll(); alert("Títulos carregados!");
            } catch(err) { alert("Erro ao ler JSON"); }
        };
        reader.readAsText(file);
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
